<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCAM | Nova senha</title>
    <meta name="description" content="Crie uma nova senha para acessar o CCAM." />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="topbar" data-topbar></header>

    <main id="conteudo">
      <div class="container auth auth--solo page">
        <section class="auth__panel">
          <a class="back-link" href="login.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"></use></svg>Voltar ao login</a>
          <h2>Criar nova senha</h2>
          <p class="lead">Escolha uma senha com pelo menos 6 caracteres.</p>

          <form id="formRedefinir">
            <div class="field">
              <label for="novaSenha">Nova senha</label>
              <div class="input-wrap">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
                <input type="password" id="novaSenha" required minlength="6" autocomplete="new-password" placeholder="Nova senha" />
                <button type="button" class="input-action" data-toggle-password aria-label="Mostrar senha"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eye"></use></svg></button>
              </div>
            </div>
            <div class="field">
              <label for="confirmaSenha">Confirmar nova senha</label>
              <div class="input-wrap">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
                <input type="password" id="confirmaSenha" required minlength="6" autocomplete="new-password" placeholder="Repita a senha" />
              </div>
            </div>
            <p class="form-alert" id="redefinirError" role="alert" hidden></p>
            <button class="btn btn--brand btn--block" type="submit">Salvar nova senha</button>
          </form>

          <div id="redefinir-invalido" hidden>
            <div class="callout"><strong>Link inválido</strong><span>Este link de recuperação está incompleto. Solicite um novo link na tela de recuperação de senha.</span>
            <a class="btn btn--sm" href="esqueci-senha.html">Solicitar novo link</a></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer" data-footer></footer>

    <script src="js/script.js"></script>
  </body>
</html>
