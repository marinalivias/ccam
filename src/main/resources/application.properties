spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ccam}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=${PORT:8081}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

ccam.admin.email=${ADMIN_EMAIL}
ccam.admin.senha=${ADMIN_SENHA}
ccam.seed.gestor-email=${GESTOR_EMAIL}
ccam.seed.gestor-senha=${GESTOR_SENHA}
ccam.auth.sessao-horas=${SESSAO_HORAS:12}
ccam.auth.exibir-link-reset=${EXIBIR_LINK_RESET:false}
